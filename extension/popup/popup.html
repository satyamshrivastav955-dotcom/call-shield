<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>antAI Guardian</title>
    <script src="../shared/risk.js"></script>
    <script src="../shared/platform.js"></script>
    <script src="../shared/incident.js"></script>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="brand">
        <span class="brand-shield">🛡️</span>
        <span class="brand-name">antAI</span>
        <span class="brand-tag">SHIELD</span>
      </div>
      <div class="header-actions">
        <span id="models" class="models-badge na" title="ML Model Status">● Offline</span>
        <button id="theme-toggle" class="theme-btn" type="button" title="Toggle Theme" aria-label="Toggle theme">🌙</button>
      </div>
    </header>

    <!-- Status Ribbon -->
    <div id="status-ribbon" class="status-ribbon">
      <div class="status-indicator">
        <span id="platform-icon" class="platform-icon">🌐</span>
        <span id="status-line" class="status-text">Standby</span>
      </div>
      <div id="audio-visualizer" class="audio-visualizer" hidden>
        <span class="pulse-dot"></span>
        <div class="meter-track">
          <div id="meter-bar-fill" class="meter-fill"></div>
        </div>
      </div>
    </div>

    <!-- Gauge Section -->
    <div class="gauge-section">
      <div class="gauge">
        <svg viewBox="0 0 120 66" width="160" height="88" aria-hidden="true">
          <path class="track" d="M 10 60 A 50 50 0 0 1 110 60"/>
          <path id="arc" class="arc" d="M 10 60 A 50 50 0 0 1 110 60"/>
          <text id="num" class="num" x="60" y="46">—</text>
          <text class="den" x="60" y="58">/ 100</text>
        </svg>
      </div>
      <div id="badge" class="badge">● MONITORING</div>
    </div>

    <!-- Forensic Signal Metrics -->
    <div id="rows" class="signals-grid"></div>

    <!-- Recommendation Card -->
    <div class="verdict-card">
      <div class="verdict-label">RECOMMENDATION</div>
      <p id="rec-text" class="rec-text">No active risk detected.</p>
    </div>

    <!-- Primary Action Button -->
    <button id="toggle" class="primary-btn" type="button">Protect this tab</button>
    <p id="error" class="error-msg" hidden></p>

    <!-- Secondary Actions -->
    <div class="action-grid">
      <button id="scan" class="secondary-btn" type="button">
        <span class="btn-icon">⚡</span> Scan Page
      </button>
      <button id="watch" class="secondary-btn" type="button">
        <span class="btn-icon">👁️</span> Live Watch
      </button>
    </div>
    <div id="scan-result" class="scan-result" hidden></div>

    <!-- Incident History Drawer -->
    <details id="incidents-details" class="incidents-panel">
      <summary class="incidents-summary">
        <span class="incidents-title">Threat Incidents</span>
        <span id="popup-incidents-count" class="incidents-count">0</span>
      </summary>
      <div id="popup-incidents-list" class="popup-incidents-list">
        <p class="popup-empty-hint">No flagged threats</p>
      </div>
      <div class="portal-footer">
        <a href="https://cybercrime.gov.in" target="_blank" rel="noopener noreferrer" class="portal-link">
          Helpline 1930 · cybercrime.gov.in ↗
        </a>
      </div>
    </details>

    <!-- Footer -->
    <footer>
      <a href="#" id="options-link" class="options-link">Settings & Account ⚙</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
