# =====================================================================
#  antAI - TURN relay for the AWS backup instance (public network).
#  Variant of ../turnserver.conf, which is loopback-only for the USB rig.
# =====================================================================
#  Differences from the USB variant:
#    - listens on all interfaces (0.0.0.0), not 127.0.0.1
#    - no allow-loopback-peers (that exists only so both USB peers can
#      relay through 127.0.0.1; on EC2 the peers arrive from real IPs)
#    - wider relay port range to match the EC2 security group
#  Matching client side: config.aws.yaml  ice.turn_url must point at the
#  EC2 Elastic IP, and the Android app's CallEngine TURN_URL too (or just
#  rely on the server's ICE config via the SFU).
# ---------------------------------------------------------------------

# TURN/STUN listening port. Open 3478 tcp+udp in the EC2 security group.
listening-port=3478

# Listen on every interface; coturn advertises the relay addresses itself.
listening-ip=0.0.0.0
# relay-ip unset -> coturn auto-detects the EC2 private IP, which is the
# correct address for peers to send to (the public IP is 1:1 NAT-mapped).

# Relay range — MUST match the udp range open in the security group.
min-port=49152
max-port=65535

# Long-term credential mechanism (username/password auth). Keep in sync
# with config.aws.yaml ice.turn_username / turn_password.
lt-cred-mech
user=antai:antaipass
realm=antai.local

# Plain TURN; no TLS/DTLS. Fine for a demo rig; TLS needs certificates
# (coturn cert + letsencrypt) — add before any real-user exposure.
no-tls
no-dtls

no-multicast-peers
no-cli

# WebRTC clients (aiortc / libwebrtc) expect the FINGERPRINT attribute.
fingerprint

# Uncomment while debugging to see each allocation and permission:
# verbose
