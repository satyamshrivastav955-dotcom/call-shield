# =====================================================================
#  antAI - local TURN relay (coturn) for USB-only call/video MEDIA
# =====================================================================
#  Why this exists:
#    Messaging, login, contacts and call *signaling* already work over USB
#    via `adb reverse` (see usb_setup.bat) because those are all TCP.
#    Live call/video *media*, however, is UDP, and `adb reverse` can only
#    tunnel TCP. So over a pure-USB link (no Wi-Fi at all) the media is
#    relayed through THIS local TURN server, over TCP, reached from each
#    phone via:   adb reverse tcp:3478 tcp:3478
#
#  How to run (from the server/ folder):
#      turnserver -c turnserver.conf
#    (Windows: run coturn under WSL or Docker - see USB_SETUP.md.)
#
#  If you are NOT on pure USB (both phones share a Wi-Fi network), you do
#  NOT need this at all: media flows over the LAN via the phones' STUN/
#  host candidates and coturn can stay off.
#
#  The credentials below MUST match:
#    - client:  CallEngine.kt  TURN_URL / TURN_USER / TURN_PASS
#    - server:  config.yaml    ice.turn_url / turn_username / turn_password
# ---------------------------------------------------------------------

# TURN/STUN listening port (matches the adb-reversed port and both configs).
listening-port=3478

# Listen only on loopback. Both clients reach it over 127.0.0.1:
#   - this machine's SFU connects to 127.0.0.1:3478 directly
#   - each phone connects to 127.0.0.1:3478, tunneled to this PC by adb reverse
listening-ip=127.0.0.1

# Allocate the relay endpoints on loopback too (everything stays on this PC).
relay-ip=127.0.0.1

# Keep the relay port range small and predictable.
min-port=50000
max-port=50100

# Long-term credential mechanism (username/password auth).
lt-cred-mech
user=antai:antaipass
realm=antai.local

# CRITICAL: both peers' relay addresses are on 127.0.0.1, so coturn must be
# allowed to relay to/from loopback peers (this is OFF by default).
allow-loopback-peers

# Plain TURN over TCP/UDP on loopback only; never exposed to a real network,
# so no TLS/DTLS (also avoids needing certificates).
no-tls
no-dtls

# Security hardening for a local-only relay.
no-multicast-peers
no-cli

# WebRTC clients (aiortc / libwebrtc) expect the FINGERPRINT attribute.
fingerprint

# Uncomment while debugging to see each allocation and permission:
# verbose
