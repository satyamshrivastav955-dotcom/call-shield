<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 490" width="100%" height="100%" style="background:#090d16; border-radius:12px; font-family:'Fira Code', 'JetBrains Mono', Consolas, Menlo, monospace;">
  <defs>
    <style>
      .term-cursor {
        animation: blink 1s step-end infinite;
      }
      .pulse-critical {
        animation: pulseCrit 1.5s ease-in-out infinite alternate;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulseCrit {
        0% { fill: #EF4444; }
        100% { fill: #FF0055; filter: drop-shadow(0 0 6px #FF0055); }
      }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="950" height="490" rx="12" fill="#0b0f19" stroke="#1f293d" stroke-width="2"/>

  <!-- Title Bar -->
  <rect width="950" height="40" rx="12" fill="#131b2e"/>
  <rect y="30" width="950" height="10" fill="#131b2e"/> <!-- flatten bottom rounded corners of header -->

  <!-- Window Control Buttons -->
  <circle cx="24" cy="20" r="6.5" fill="#FF5F56"/>
  <circle cx="44" cy="20" r="6.5" fill="#FFBD2E"/>
  <circle cx="64" cy="20" r="6.5" fill="#27C93F"/>

  <!-- Window Title -->
  <text x="475" y="25" fill="#94A3B8" font-size="13" font-weight="600" text-anchor="middle">antai-core-engine --live-defense [Session #4829-E2E]</text>

  <!-- Live Status Dot -->
  <circle cx="914" cy="20" r="4.5" fill="#00E676"/>
  <text x="902" y="24" fill="#00E676" font-size="11" font-weight="700" text-anchor="end">STREAMING ACTIVE</text>

  <!-- Line 1: Startup & DAG Compile -->
  <g font-size="12.5">
    <text x="30" y="74" fill="#64748B">[00:00.012]</text>
    <text x="125" y="74" fill="#38BDF8" font-weight="700">[ORCHESTRATOR]</text>
    <text x="248" y="74" fill="#E2E8F0">Compiling 14-Node LangGraph DAG: router ➔ voice/video/text ➔ fusion ➔ intercept</text>
    <text x="850" y="74" fill="#00F5D4" font-weight="700">[READY]</text>
  </g>

  <!-- Line 2: Ingestion & VAD -->
  <g font-size="12.5">
    <text x="30" y="104" fill="#64748B">[00:00.145]</text>
    <text x="125" y="104" fill="#00F5D4" font-weight="700">[INGESTION]</text>
    <text x="248" y="104" fill="#E2E8F0">Audio stream tapped (/api/stream/ws). Silero-VAD segmented active speech (1.82s)</text>
  </g>

  <!-- Line 3: ASR Transcript -->
  <g font-size="12.5">
    <text x="30" y="134" fill="#64748B">[00:00.410]</text>
    <text x="125" y="134" fill="#818CF8" font-weight="700">[STREAM-ASR]</text>
    <text x="248" y="134" fill="#FDE68A">&quot;Mom, it's me! I was in a bad accident, need ₹50,000 immediately, do not tell Dad!&quot;</text>
  </g>

  <!-- Line 4: SSL Voice Analysis -->
  <g font-size="12.5">
    <text x="30" y="168" fill="#64748B">[00:00.620]</text>
    <text x="125" y="168" fill="#F43F5E" font-weight="700">[VOICE-SSL]</text>
    <text x="248" y="168" fill="#E2E8F0">AST-ASV5 + wav2vec2 ensemble spoof_prob: </text>
    <text x="585" y="168" fill="#FF3366" font-weight="700">0.971 (97.1% SYNTHETIC CLONE)</text>
    <rect x="805" y="154" width="112" height="20" rx="4" fill="#4C0519" stroke="#E11D48" stroke-width="0.8"/>
    <text x="861" y="168" fill="#FDA4AF" font-size="10" font-weight="700" text-anchor="middle">HARD SIGNAL</text>
  </g>

  <!-- Line 5: Biometric Verification -->
  <g font-size="12.5">
    <text x="30" y="202" fill="#64748B">[00:00.710]</text>
    <text x="125" y="202" fill="#F43F5E" font-weight="700">[BIOMETRIC]</text>
    <text x="248" y="202" fill="#E2E8F0">ECAPA-TDNN cosine vs enrolled son profile: </text>
    <text x="585" y="202" fill="#F43F5E" font-weight="700">0.284 &lt; 0.600 threshold</text>
    <text x="785" y="202" fill="#FCA5A5" font-weight="700">[IMPERSONATION]</text>
  </g>

  <!-- Line 6: NLP Scam Intent & Urgency -->
  <g font-size="12.5">
    <text x="30" y="236" fill="#64748B">[00:00.790]</text>
    <text x="125" y="236" fill="#FBBF24" font-weight="700">[NLP-INTENT]</text>
    <text x="248" y="236" fill="#94A3B8">Scam: <tspan fill="#FDE047" font-weight="700">Family Emergency (0.94)</tspan>  |  Urgency: <tspan fill="#FDE047" font-weight="700">0.880</tspan>  |  Ask: <tspan fill="#FF5376" font-weight="700">Direct Wire</tspan></text>
  </g>

  <!-- Divider Line -->
  <line x1="30" y1="258" x2="920" y2="258" stroke="#1F293D" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Line 7: Calibrated Risk Fusion Result -->
  <g font-size="12.5">
    <text x="30" y="288" fill="#64748B">[00:00.840]</text>
    <text x="125" y="288" fill="#A855F7" font-weight="700">[FUSION-CAL]</text>
    <text x="248" y="288" fill="#FFFFFF" font-weight="700">CALCULATED COMPOSITE RISK: </text>
    <text x="475" y="288" class="pulse-critical" font-size="15" font-weight="900">94 / 100</text>
    <rect x="560" y="273" width="168" height="22" rx="4" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
    <text x="644" y="288" fill="#FEE2E2" font-size="11" font-weight="800" text-anchor="middle">BAND: CRITICAL RISK</text>
  </g>

  <!-- Line 8: Intercept Directives & Explainable AI Card -->
  <g transform="translate(30, 310)">
    <rect width="890" height="102" rx="8" fill="#141E33" stroke="#00F5D4" stroke-width="1.2"/>
    <text x="18" y="25" fill="#00F5D4" font-weight="700" font-size="13">🛡️ AUTONOMOUS PROTECTIVE INTERCEPT TRIGGERED:</text>
    <text x="18" y="48" fill="#F1F5F9" font-size="12">➔ <tspan fill="#FF5376" font-weight="700">CALL PAUSED</tspan> : AiInsightWindow &amp; DeepfakeAlertDialog rendered on Android client</text>
    <text x="18" y="69" fill="#F1F5F9" font-size="12">➔ <tspan fill="#FBBF24" font-weight="700">FREEZE HOLD</tspan> : Financial transfer / OTP modal locked with conscious override required</text>
    <text x="18" y="90" fill="#F1F5F9" font-size="12">➔ <tspan fill="#38BDF8" font-weight="700">LLM REASONING</tspan> : &quot;Do not send ₹50,000. Voice is 97% synthetic clone. Call your son on his regular cell.&quot;</text>
  </g>

  <!-- Terminal Prompt & Blinking Cursor -->
  <g transform="translate(30, 448)" font-size="12.5">
    <text x="0" y="0" fill="#00F5D4" font-weight="700">antai@defense-node:~$</text>
    <text x="195" y="0" fill="#94A3B8">monitoring active streams...</text>
    <rect x="415" y="-12" width="8.5" height="16" fill="#00F5D4" class="term-cursor"/>
  </g>
</svg>
